<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MulaLink — Earn Money Online | Affiliate Hub Kenya</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
  :root{
    --primary:#0b1f3f;
    --primary-light:#1d3b6b;
    --accent:#ffb347;
    --accent-dark:#ff8c1a;
    --green:#25D366;
    --text:#1a2238;
    --muted:#5a6a85;
    --bg:#f5f7fc;
    --card:#ffffff;
    --radius:22px;
    --shadow:0 20px 40px -18px rgba(11,31,63,0.18);
  }
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.55;}
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(120px);opacity:0.35;z-index:-1;pointer-events:none;
  }
  body::before{width:500px;height:500px;background:#ffb347;top:-200px;left:-150px;animation:float1 12s ease-in-out infinite;}
  body::after{width:600px;height:600px;background:#3b6bd6;bottom:-250px;right:-200px;animation:float2 14s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,40px) scale(1.1);}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-50px,-30px) scale(1.15);}}

  /* NAVBAR */
  .navbar{
    position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);
    background:rgba(255,255,255,0.78);border-bottom:1px solid rgba(11,31,63,0.06);
    padding:0.9rem 1.5rem;
  }
  .nav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;color:var(--primary);letter-spacing:-0.5px;cursor:pointer;}
  .logo-badge{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;color:white;font-size:1.1rem;
    box-shadow:0 8px 20px -6px rgba(255,140,26,0.5);
  }
  .nav-links{display:flex;gap:1.8rem;list-style:none;}
  .nav-links a{color:var(--primary);text-decoration:none;font-weight:500;font-size:0.9rem;position:relative;transition:0.2s;cursor:pointer;}
  .nav-links a:hover{color:var(--accent-dark);}
  .nav-links a::after{content:'';position:absolute;bottom:-6px;left:0;width:0;height:2px;background:var(--accent);transition:width 0.3s;}
  .nav-links a:hover::after{width:100%;}
  .nav-cta{
    background:var(--primary);color:white;padding:0.7rem 1.4rem;border-radius:50px;
    text-decoration:none;font-weight:600;font-size:0.88rem;display:inline-flex;align-items:center;gap:8px;
    transition:0.25s;box-shadow:0 10px 20px -8px rgba(11,31,63,0.4);cursor:pointer;border:none;
  }
  .nav-cta:hover{background:var(--accent-dark);transform:translateY(-2px);}

  .container{max-width:1280px;margin:0 auto;padding:0 1.5rem;}

  /* PAGE VIEWS */
  .page{display:none;}
  .page.active{display:block;animation:fadeIn 0.4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* HERO */
  .hero{
    position:relative;margin:2rem auto 2.5rem;border-radius:32px;overflow:hidden;
    background:linear-gradient(135deg,#0b1f3f 0%,#1d3b6b 55%,#2a4f8a 100%);
    color:white;padding:3.5rem 3rem;box-shadow:var(--shadow);
    display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:center;
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 80% 20%,rgba(255,179,71,0.25),transparent 45%),
      radial-gradient(circle at 15% 85%,rgba(63,131,248,0.3),transparent 45%);
    pointer-events:none;
  }
  .hero-text{position:relative;z-index:2;}
  .hero-tag{
    display:inline-flex;align-items:center;gap:8px;background:rgba(255,179,71,0.15);
    border:1px solid rgba(255,179,71,0.4);color:#ffd280;padding:0.4rem 1rem;border-radius:50px;
    font-size:0.82rem;font-weight:600;margin-bottom:1.2rem;letter-spacing:0.3px;
  }
  .hero h1{font-size:2.8rem;font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:1rem;}
  .hero h1 .highlight{background:linear-gradient(135deg,var(--accent),#ffd280);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{font-size:1.02rem;opacity:0.85;max-width:520px;margin-bottom:2rem;}
  .hero-buttons{display:flex;gap:1rem;flex-wrap:wrap;}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:var(--primary);
    padding:1rem 2rem;border-radius:60px;border:none;font-weight:700;font-size:1rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;text-decoration:none;transition:0.25s;
    box-shadow:0 15px 30px -10px rgba(255,140,26,0.6);
  }
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 22px 35px -10px rgba(255,140,26,0.7);}
  .btn-ghost{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);
    color:white;padding:1rem 1.6rem;border-radius:60px;font-weight:600;text-decoration:none;font-size:0.98rem;
    display:inline-flex;align-items:center;gap:10px;backdrop-filter:blur(8px);transition:0.25s;cursor:pointer;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.18);transform:translateY(-3px);}
  .btn-ghost i{color:var(--green);}

  .hero-visual{position:relative;z-index:2;display:flex;flex-direction:column;gap:1rem;}
  .earn-card-float{
    background:rgba(255,255,255,0.1);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.18);border-radius:20px;padding:1.1rem 1.3rem;
    display:flex;align-items:center;gap:14px;animation:slideIn 0.8s ease both;
  }
  .earn-card-float:nth-child(2){animation-delay:0.15s;margin-left:2rem;}
  .earn-card-float:nth-child(3){animation-delay:0.3s;margin-left:4rem;}
  @keyframes slideIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
  .earn-card-float .icon{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:var(--primary);flex-shrink:0;
  }
  .earn-card-float .info h4{font-size:0.92rem;font-weight:700;}
  .earn-card-float .info p{font-size:0.78rem;opacity:0.75;}
  .earn-card-float .amount{margin-left:auto;font-weight:800;color:#9dffb0;font-size:0.95rem;}

  /* STATS BAR */
  .stats-bar{
    background:var(--card);border-radius:22px;padding:1.6rem 2rem;box-shadow:var(--shadow);
    display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:3rem;
  }
  .stat{text-align:center;padding:0 0.5rem;border-right:1px solid #eef1f7;}
  .stat:last-child{border-right:none;}
  .stat h3{font-size:1.7rem;font-weight:800;color:var(--primary);letter-spacing:-0.5px;}
  .stat h3 span{color:var(--accent-dark);}
  .stat p{font-size:0.8rem;color:var(--muted);font-weight:500;margin-top:4px;}

  /* SECTION HEAD */
  .section-head{text-align:center;margin-bottom:2.5rem;}
  .section-head .eyebrow{display:inline-block;color:var(--accent-dark);font-weight:700;font-size:0.82rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:0.6rem;}
  .section-head h2{font-size:2.2rem;font-weight:800;color:var(--primary);letter-spacing:-1px;margin-bottom:0.6rem;}
  .section-head p{color:var(--muted);max-width:560px;margin:0 auto;font-size:0.98rem;}

  /* CARDS GRID */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:1.6rem;margin-bottom:3.5rem;}
  .card{
    background:var(--card);border-radius:var(--radius);padding:1.7rem;box-shadow:0 10px 30px -14px rgba(11,31,63,0.12);
    border:1px solid #eef1f7;display:flex;flex-direction:column;transition:all 0.3s ease;position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent-dark));
    transform:scaleX(0);transform-origin:left;transition:transform 0.4s ease;
  }
  .card:hover::before{transform:scaleX(1);}
  .card:hover{transform:translateY(-8px);box-shadow:0 30px 45px -18px rgba(11,31,63,0.22);border-color:#ffe0b3;}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;}
  .card-icon{
    width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#eef3ff,#dce7ff);
    color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;transition:all 0.3s ease;
  }
  .card:hover .card-icon{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:white;transform:rotate(-6deg) scale(1.05);}
  .card-number{font-size:0.72rem;font-weight:700;color:var(--muted);background:#f1f4fa;padding:0.3rem 0.7rem;border-radius:50px;letter-spacing:1px;}
  .card h3{font-size:1.18rem;font-weight:700;color:var(--primary);margin-bottom:0.5rem;letter-spacing:-0.3px;}
  .card p{color:var(--muted);font-size:0.9rem;line-height:1.6;margin-bottom:1.3rem;flex:1;}
  .earn-tag{display:inline-flex;align-items:center;gap:6px;background:#e8f8ee;color:#0f8a3e;font-size:0.72rem;font-weight:700;padding:0.3rem 0.7rem;border-radius:50px;margin-bottom:1rem;width:fit-content;}
  .card .register-btn{
    background:var(--primary);color:white;padding:0.85rem 1.2rem;border-radius:50px;border:none;
    font-weight:700;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    text-decoration:none;transition:0.25s;
  }
  .card .register-btn:hover{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:var(--primary);transform:translateY(-2px);box-shadow:0 12px 22px -8px rgba(255,140,26,0.5);}
  .card .register-btn i{transition:transform 0.25s;}
  .card .register-btn:hover i{transform:translateX(4px);}

  /* CHAT PAGE HERO */
  .chat-hero{
    background:linear-gradient(135deg,#1a0033 0%,#3d0066 50%,#5b0a91 100%);
    border-radius:32px;padding:3rem;color:white;margin-bottom:2.5rem;
    position:relative;overflow:hidden;
  }
  .chat-hero::before{
    content:'💬';position:absolute;font-size:16rem;right:-40px;top:-40px;opacity:0.06;
  }
  .chat-hero h1{font-size:2.4rem;font-weight:800;letter-spacing:-1px;margin-bottom:0.8rem;position:relative;z-index:2;}
  .chat-hero h1 span{background:linear-gradient(135deg,#ffb347,#ffd280);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .chat-hero p{max-width:620px;font-size:1rem;opacity:0.85;margin-bottom:1.8rem;position:relative;z-index:2;}
  .chat-hero-badges{display:flex;gap:0.7rem;flex-wrap:wrap;margin-bottom:1.8rem;position:relative;z-index:2;}
  .chat-hero-badge{
    background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
    padding:0.4rem 1rem;border-radius:50px;font-size:0.82rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chat-hero-badge i{color:#ffb347;}

  /* CHAT LAYOUT */
  .chat-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;margin-bottom:3rem;}
  .chat-window{
    background:var(--card);border-radius:24px;padding:1.5rem;box-shadow:var(--shadow);
    border:1px solid #eef1f7;display:flex;flex-direction:column;height:520px;
  }
  .chat-window-head{display:flex;align-items:center;gap:12px;padding-bottom:1rem;border-bottom:1px solid #eef1f7;margin-bottom:1rem;}
  .chat-avatar{
    width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c1a,#ffb347);
    display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:1rem;flex-shrink:0;
  }
  .chat-avatar.online{position:relative;}
  .chat-avatar.online::after{
    content:'';position:absolute;bottom:2px;right:2px;width:12px;height:12px;border-radius:50%;
    background:#25D366;border:2px solid white;
  }
  .chat-window-head h4{font-size:0.98rem;font-weight:700;color:var(--primary);}
  .chat-window-head span{font-size:0.78rem;color:var(--muted);}
  .chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.8rem;padding-right:0.5rem;margin-bottom:1rem;}
  .chat-messages::-webkit-scrollbar{width:6px;}
  .chat-messages::-webkit-scrollbar-thumb{background:#dce7ff;border-radius:10px;}
  .msg{max-width:80%;padding:0.7rem 1rem;border-radius:16px;font-size:0.88rem;line-height:1.5;}
  .msg.them{background:#f0f4ff;color:var(--primary);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.me{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg-time{font-size:0.68rem;opacity:0.55;margin-top:4px;display:block;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{
    flex:1;padding:0.85rem 1.2rem;border-radius:50px;border:1px solid #dce7ff;font-size:0.9rem;outline:none;
    font-family:inherit;transition:0.2s;
  }
  .chat-input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,179,71,0.15);}
  .chat-send{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));border:none;
    width:48px;height:48px;border-radius:50%;cursor:pointer;color:var(--primary);font-size:1rem;
    transition:0.2s;flex-shrink:0;
  }
  .chat-send:hover{transform:scale(1.08);}

  .chat-sidebar{display:flex;flex-direction:column;gap:1.2rem;}
  .chat-info-card{
    background:var(--card);border-radius:20px;padding:1.5rem;box-shadow:0 10px 30px -14px rgba(11,31,63,0.12);
    border:1px solid #eef1f7;
  }
  .chat-info-card h4{font-size:1.05rem;font-weight:700;color:var(--primary);margin-bottom:0.9rem;display:flex;align-items:center;gap:8px;}
  .chat-info-card h4 i{color:var(--accent-dark);}
  .rate-list{list-style:none;display:flex;flex-direction:column;gap:0.6rem;}
  .rate-list li{display:flex;justify-content:space-between;align-items:center;padding:0.7rem 1rem;background:#f7f9ff;border-radius:12px;font-size:0.88rem;}
  .rate-list li strong{color:var(--accent-dark);font-weight:700;}
  .chat-now-btn{
    background:linear-gradient(135deg,#ff5c8a,#ff8c1a);color:white;padding:1rem 1.5rem;border-radius:50px;
    border:none;font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    text-decoration:none;transition:0.25s;box-shadow:0 15px 30px -10px rgba(255,92,138,0.55);width:100%;
  }
  .chat-now-btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 20px 35px -10px rgba(255,92,138,0.7);}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#25D366;display:inline-block;animation:pulseDot 1.5s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.3);}}

  /* INSTANT WITHDRAWAL BANNER */
  .instant-banner{
    background:linear-gradient(135deg,#0f8a3e,#25D366);color:white;border-radius:24px;
    padding:2rem 2.5rem;margin-bottom:3rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
    box-shadow:0 20px 40px -18px rgba(15,138,62,0.5);position:relative;overflow:hidden;
  }
  .instant-banner::before{content:'⚡';position:absolute;font-size:10rem;right:20px;top:-30px;opacity:0.12;}
  .instant-banner .icon{width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;}
  .instant-banner h3{font-size:1.6rem;font-weight:800;letter-spacing:-0.5px;}
  .instant-banner p{opacity:0.9;font-size:0.95rem;}
  .instant-banner .btn-ghost{border-color:rgba(255,255,255,0.5);margin-left:auto;}

  /* BENEFITS */
  .benefits-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.4rem;margin-bottom:3rem;}
  .benefit{
    background:var(--card);border-radius:20px;padding:1.6rem;text-align:center;
    box-shadow:0 10px 30px -14px rgba(11,31,63,0.12);border:1px solid #eef1f7;transition:0.3s;
  }
  .benefit:hover{transform:translateY(-5px);border-color:#ffe0b3;}
  .benefit .b-icon{
    width:56px;height:56px;margin:0 auto 1rem;border-radius:16px;
    background:linear-gradient(135deg,#eef3ff,#dce7ff);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  }
  .benefit h4{font-size:1rem;font-weight:700;color:var(--primary);margin-bottom:0.4rem;}
  .benefit p{font-size:0.83rem;color:var(--muted);line-height:1.55;}

  /* HOW IT WORKS */
  .steps{background:linear-gradient(135deg,#0b1f3f,#1d3b6b);border-radius:32px;padding:3rem 2.5rem;color:white;margin-bottom:3.5rem;position:relative;overflow:hidden;}
  .steps::after{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,179,71,0.25),transparent 65%);}
  .steps .section-head{text-align:left;margin-bottom:2rem;position:relative;z-index:2;}
  .steps .section-head h2{color:white;}
  .steps .section-head p{color:rgba(255,255,255,0.7);margin:0;}
  .steps .section-head .eyebrow{color:var(--accent);}
  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;position:relative;z-index:2;}
  .step{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:1.6rem;backdrop-filter:blur(10px);transition:0.3s;}
  .step:hover{background:rgba(255,255,255,0.12);transform:translateY(-4px);}
  .step .num{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:var(--primary);font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;}
  .step h4{font-size:1.05rem;font-weight:700;margin-bottom:0.4rem;}
  .step p{font-size:0.88rem;opacity:0.75;line-height:1.55;}

  /* TESTIMONIALS */
  .testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;margin-bottom:3.5rem;}
  .testi{background:var(--card);border-radius:20px;padding:1.7rem;box-shadow:0 10px 30px -14px rgba(11,31,63,0.12);border:1px solid #eef1f7;transition:0.3s;}
  .testi:hover{transform:translateY(-5px);box-shadow:0 25px 40px -18px rgba(11,31,63,0.2);}
  .stars{color:var(--accent);font-size:0.9rem;margin-bottom:0.7rem;letter-spacing:2px;}
  .testi p{font-size:0.9rem;color:var(--muted);line-height:1.65;margin-bottom:1.1rem;font-style:italic;}
  .testi-user{display:flex;align-items:center;gap:12px;}
  .testi-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
  .testi-user h5{font-size:0.9rem;font-weight:700;color:var(--primary);}
  .testi-user span{font-size:0.76rem;color:var(--muted);}

  /* FAQ */
  .faq-list{max-width:820px;margin:0 auto 3.5rem;display:flex;flex-direction:column;gap:0.9rem;}
  .faq-item{background:var(--card);border-radius:16px;border:1px solid #eef1f7;box-shadow:0 8px 25px -14px rgba(11,31,63,0.1);overflow:hidden;transition:0.3s;}
  .faq-item:hover{border-color:#ffe0b3;}
  .faq-q{
    padding:1.1rem 1.4rem;font-weight:700;font-size:0.98rem;color:var(--primary);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:1rem;
  }
  .faq-q i{color:var(--accent-dark);transition:transform 0.3s;flex-shrink:0;}
  .faq-item.open .faq-q i{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height 0.35s ease,padding 0.3s;padding:0 1.4rem;color:var(--muted);font-size:0.9rem;line-height:1.65;}
  .faq-item.open .faq-a{max-height:300px;padding:0 1.4rem 1.2rem;}

  /* SOS SECTION */
  .sos-section{
    background:linear-gradient(135deg,#8a0f0f,#c62828);border-radius:28px;padding:2.5rem;
    color:white;margin-bottom:3rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap;
    box-shadow:0 20px 45px -18px rgba(198,40,40,0.6);position:relative;overflow:hidden;
  }
  .sos-section::before{content:'🆘';position:absolute;font-size:12rem;right:-20px;bottom:-40px;opacity:0.08;}
  .sos-pulse{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:2.2rem;flex-shrink:0;animation:sosPulse 1.5s infinite;}
  @keyframes sosPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.4);}50%{box-shadow:0 0 0 20px rgba(255,255,255,0);}}
  .sos-section h3{font-size:1.6rem;font-weight:800;margin-bottom:0.4rem;letter-spacing:-0.5px;}
  .sos-section p{opacity:0.9;font-size:0.95rem;max-width:520px;}
  .sos-actions{display:flex;gap:0.8rem;flex-wrap:wrap;margin-top:1rem;}
  .sos-btn{
    background:white;color:#c62828;padding:0.85rem 1.5rem;border-radius:50px;font-weight:700;
    text-decoration:none;font-size:0.9rem;display:inline-flex;align-items:center;gap:8px;
    transition:0.25s;border:none;cursor:pointer;
  }
  .sos-btn:hover{transform:translateY(-3px);box-shadow:0 12px 25px -8px rgba(0,0,0,0.3);}
  .sos-btn.wa{background:#25D366;color:white;}

  /* FINAL CTA */
  .final-cta{
    text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    border-radius:32px;padding:3rem 2rem;margin-bottom:3.5rem;color:var(--primary);position:relative;overflow:hidden;
  }
  .final-cta::before{content:'🎉';position:absolute;font-size:12rem;opacity:0.08;bottom:-40px;left:-20px;transform:rotate(-15deg);}
  .final-cta::after{content:'💰';position:absolute;font-size:12rem;opacity:0.08;top:-50px;right:-20px;transform:rotate(15deg);}
  .final-cta h2{font-size:2.1rem;font-weight:800;letter-spacing:-1px;margin-bottom:0.7rem;position:relative;z-index:2;}
  .final-cta p{font-size:1rem;max-width:560px;margin:0 auto 1.8rem;position:relative;z-index:2;font-weight:500;}
  .final-cta .btn-primary{background:var(--primary);color:white;box-shadow:0 18px 35px -12px rgba(11,31,63,0.5);position:relative;z-index:2;}
  .final-cta .btn-primary:hover{background:#0e2a56;transform:translateY(-3px);}

  /* FOOTER */
  footer{background:var(--primary);color:white;padding:3rem 1.5rem 2rem;border-radius:32px 32px 0 0;margin-top:2rem;}
  .footer-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:2.5rem;margin-bottom:2rem;}
